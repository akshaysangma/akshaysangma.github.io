<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Prep — Akshay Sangma</title>
<script>if (location.hash.startsWith("#/")) location.replace("ipo/" + location.hash);</script>
<link rel="stylesheet" href="assets/app.css">
<style>
.home{max-width:860px;margin:0 auto;padding:40px 20px 80px}
.prep{display:block;text-decoration:none;color:var(--ink);border-left:4px solid var(--accent)}
.prep:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(0,0,0,.08)}
.prep h2{margin:2px 0 6px}
.prep .when{font-size:14px;color:var(--ink2)}
.prep .days{float:right;text-align:right;margin-left:16px}
.prep.past{opacity:.6;border-left-color:var(--line)}
</style>
<script>document.documentElement.dataset.theme = localStorage.getItem("je-theme") || localStorage.getItem("ipo-theme") || "light";</script>
</head>
<body>
<main class="home">
  <h1>Exam prep</h1>
  <p class="muted">Pick a preparation. Progress is saved in this browser, separately for each one.</p>
  <div id="preps"></div>
</main>
<script>
"use strict";
const PREPS = [
  {
    href: "je-electrical/",
    title: "JE (Electrical) under PWD — interview",
    when: "Personal interview · 12 Nov 2026, 10:30 AM · MPSC Office, Shillong",
    date: "2026-11-12",
    blurb: "Interview Q&A decks with model answers, mock interview with a timer, 12-day plan and documents checklist.",
    progress: () => {
      const s = JSON.parse(localStorage.getItem("je-prep-v1") || "{}");
      const solid = Object.values(s.r || {}).filter(r => r.s === 2).length;
      return solid ? `${solid} cards rated solid · ${(s.mocks || []).length} mock interviews` : "";
    },
  },
  {
    href: "ipo/",
    title: "IPO Meghalaya — written exam",
    when: "Written exam · 28 Nov 2026, 10:00 AM · Shillong and Tura",
    date: "2026-11-28",
    blurb: "Industrial Promotion Officer (MPSC): learning path, past papers, mock tests, review queue and maths drills.",
    progress: () => {
      const s = JSON.parse(localStorage.getItem("ipo-prep-v1") || "{}");
      const tests = (s.tests || []).length;
      return tests ? `${tests} tests taken` : "";
    },
  },
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const today = new Date(new Date().toDateString());
const daysTo = d => Math.round((new Date(d + "T00:00") - today) / 86400000);
document.getElementById("preps").innerHTML = PREPS
  .map(p => ({ ...p, days: daysTo(p.date) }))
  .sort((a, b) => (a.days < 0) - (b.days < 0) || a.days - b.days)
  .map(p => {
    let progress = "";
    try { progress = p.progress(); } catch {}
    const days = p.days > 0 ? `<div class="stat">${p.days}</div><div class="stat-label">days left</div>`
      : p.days === 0 ? `<div class="stat">Today</div>` : `<div class="stat-label">done</div>`;
    return `<a class="card prep ${p.days < 0 ? "past" : ""}" href="${p.href}">
      <div class="days">${days}</div>
      <h2>${esc(p.title)}</h2>
      <div class="when">${esc(p.when)}</div>
      <p class="small muted">${esc(p.blurb)}</p>
      ${progress ? `<div class="small"><span class="tag good">${esc(progress)}</span></div>` : ""}
    </a>`;
  })
  .join("");
</script>
</body>
</html>
